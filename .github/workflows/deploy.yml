name: Deploy to Hostinger

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/waffle.html'
      - 'public/waffle-gizlilik.html'
      - 'public/waffle-kullanim-kosullari.html'
      - 'scripts/deploy.js'
      - 'scripts/deploy.safety.test.js'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/waffle-policy-validation.yml'
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build production bundle
        run: npm run build

      - name: Deploy to Hostinger via verified FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_PATH: .
        run: |
          node scripts/deploy.js
