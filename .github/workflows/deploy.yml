name: Publish approved Waffle notices only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: waffle-notices-publication
  cancel-in-progress: false
jobs:
  publish-notices:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout reviewed publication source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Publish three approved pages with verified encrypted transport
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 waffle-publication/publish.py
