  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFFFFF">
  <script>
    /* İlk boyamadan önce: kayıtlı temayı uygula (beyaz flaşı önler) ve JS'in çalıştığını işaretle. */
    (function () {
      var d = document.documentElement, t = 'light';
      try { t = localStorage.getItem('projenic_theme') || 'light'; } catch (e) {}
      d.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
      d.classList.add('js');
    })();
  </script>
